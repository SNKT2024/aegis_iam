version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: aegis_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aegis_cache
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
